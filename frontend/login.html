<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="登录云课学伴，开始课程练习与薄弱项分析">
    <title>登录 · 云课学伴</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/common.css?v=20261020-attendance-1">
    <script type="module" src="/assets/js/app.js?v=20261020-attendance-1"></script>
    <link rel="stylesheet" href="/assets/css/workspace.css?v=20261020-attendance-1">
</head>
<body data-page="login">
<div class="login-page">
    <aside class="login-art">
        <div class="brand"><span
                class="brand-mark">云</span><span><strong>云课学伴</strong><small>CLASSROOM WORKSPACE</small></span>
        </div>
        <div class="login-story">
            <div class="eyebrow">YOUR LEARNING, IN FOCUS</div>
            <h1>每一步积累，<br>都看得见。</h1>
            <p>连接课程、练习与学习反馈。梳理知识脉络，发现需要巩固的地方，让下一次进步更有方向。</p>
            <div class="login-preview" aria-hidden="true">
                <div class="preview-header"><strong>学习成长看板</strong><span class="preview-dots">● ● ●</span></div>
                <div class="preview-metrics">
                    <div><small>课程探索</small><strong>多课程</strong></div>
                    <div><small>练习积累</small><strong>循序渐进</strong></div>
                    <div><small>学习反馈</small><strong>清晰可见</strong></div>
                </div>
                <div class="preview-chart"><span style="height:28%"></span><span style="height:48%"></span><span
                        style="height:39%"></span><span style="height:65%"></span><span style="height:55%"></span><span
                        style="height:78%"></span><span style="height:95%"></span></div>
                <div class="preview-caption">练习 · 回顾 · 巩固 · 成长</div>
            </div>
        </div>
        <footer>云课学伴 · 学习分析系统 · 数据库系统课程设计</footer>
    </aside>
    <main class="login-panel">
        <div class="login-form">
            <div class="eyebrow" style="color:var(--green)">WELCOME TO YOUR WORKSPACE</div>
            <h2>欢迎回到云课学伴</h2>
            <p class="subtitle">登录账号，开启今天的学习。</p>
            <div id="login-message" aria-live="polite"></div>
            <form id="login-form">
                <div class="field"><label for="username">账号 / 学号</label><input id="username" autocomplete="username"
                                                                                   maxlength="32" required
                                                                                   placeholder="请输入账号或学生学号">
                </div>
                <div class="field"><label for="password">登录密码</label><input id="password" type="password"
                                                                                autocomplete="current-password"
                                                                                maxlength="72" required
                                                                                placeholder="请输入密码"></div>
                <button type="submit">进入学习空间 →</button>
            </form>
            <p class="fineprint">学生账号由教师统一创建<br>初始密码为 123456，登录后可自愿修改。</p></div>
    </main>
</div>
<noscript>请启用 JavaScript 后使用本网站。</noscript>
</body>
</html>
