server:
  port: ${SERVER_PORT:18090}
  address: 127.0.0.1
spring:
  application:
    name: classroom-learning
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/classroom_learning?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
  sql:
    init:
      mode: never
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    call-setters-on-nulls: true
app:
  jwt-secret: ${JWT_SECRET}
  bootstrap-admin-password: ${ADMIN_INITIAL_PASSWORD:}
